[project]
name = "openbb-core"
version = "1.4.7"
description = "OpenBB package with core functionality."
authors = [
    {name = "OpenBB Team", email = "hello@openbb.co"},
]
license = {text = "AGPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.9.21,<3.13"
dependencies = [
    "uvicorn>=0.34.2,<0.35.0",
    "websockets>=15.0,<16.0",
    "pandas>=1.5.3",
    "html5lib>=1.1,<2.0",
    "fastapi>=0.115,<0.116",
    "uuid7>=0.1.0,<0.2.0",
    "posthog>=3.3.1,<4.0.0",
    "python-multipart>=0.0.20,<0.0.21",
    "pydantic>=2.5.1,<3.0.0",
    "requests>=2.32.1,<3.0.0",
    "importlib-metadata>=6.8.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "aiohttp>=3.11.11,<4.0.0",
    "ruff>=0.7,<0.8",
    "pyjwt>=2.10.1,<3.0.0",
]

[project.scripts]
openbb-build = "openbb_core.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openbb_core"]
