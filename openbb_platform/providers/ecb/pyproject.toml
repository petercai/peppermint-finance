[project]
name = "openbb-ecb"
version = "1.4.2"
description = "ECB extension for OpenBB"
authors = [
    {name = "OpenBB Team", email = "hello@openbb.co"},
]
license = {text = "AGPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.9.21,<3.13"
dependencies = [
    "openbb-core",
    "xmltodict>=0.13.0,<0.14.0",
]

[project.entry-points.openbb_provider_extension]
ecb = "openbb_ecb:ecb_provider"

[tool.uv.sources]
openbb-core = { path = "../../core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["openbb_ecb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
