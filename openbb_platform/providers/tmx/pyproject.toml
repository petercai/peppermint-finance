[project]
name = "openbb-tmx"
version = "1.3.2"
description = "Unofficial TMX data provider extension for the OpenBB Platform - Public Canadian markets data for Python and Fast API."
authors = [
    {name = "OpenBB", email = "hello@openbb.co"},
]
license = {text = "AGPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.9.21,<3.13"
dependencies = [
    "aiohttp-client-cache>=0.11.0,<0.12.0",
    "aiosqlite>=0.20.0,<0.21.0",
    "random-user-agent>=1.0.1,<2.0.0",
    "exchange-calendars>=4.5.4,<5.0.0",
    "openbb-core",
]

[project.entry-points.openbb_provider_extension]
tmx = "openbb_tmx:tmx_provider"

[tool.uv.sources]
openbb-core = { path = "../../core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["openbb_tmx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
