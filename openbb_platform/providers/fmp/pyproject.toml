[project]
name = "openbb-fmp"
version = "1.4.2"
description = "FMP extension for OpenBB"
authors = [
    {name = "OpenBB Team", email = "hello@openbb.co"},
]
license = {text = "AGPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.9.21,<3.13"
dependencies = [
    "openbb-core",
]

[project.entry-points.openbb_provider_extension]
fmp = "openbb_fmp:fmp_provider"

[tool.uv.sources]
openbb-core = { path = "../../core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["openbb_fmp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
