[project]
name = "openbb-federal-reserve"
version = "1.4.2"
description = "US Federal Reserve Data Extension for OpenBB"
authors = [
    {name = "OpenBB", email = "hello@openbb.co"},
]
license = {text = "AGPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.9.21,<3.13"
dependencies = [
    "openbb-core",
]

[project.entry-points.openbb_provider_extension]
federal_reserve = "openbb_federal_reserve:federal_reserve_provider"

[tool.uv.sources]
openbb-core = { path = "../../core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["openbb_federal_reserve"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
