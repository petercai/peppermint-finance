[project]
name = "openbb-tradier"
version = "1.3.1"
description = "Tradier Provider Extension for the OpenBB Platform"
authors = [
    {name = "OpenBB", email = "hello@openbb.co"},
]
license = {text = "AGPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.9.21,<3.13"
dependencies = [
    "openbb-core",
]

[project.entry-points.openbb_provider_extension]
tradier = "openbb_tradier:tradier_provider"

[tool.uv.sources]
openbb-core = { path = "../../core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["openbb_tradier"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
