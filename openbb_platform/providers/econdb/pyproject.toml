[project]
name = "openbb-econdb"
version = "1.3.1"
description = "EconDB extension for OpenBB"
authors = [
    {name = "OpenBB Team", email = "hello@openbb.co"},
]
license = {text = "AGPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.9.21,<3.13"
dependencies = [
    "openbb-core",
    "aiohttp-client-cache>=0.11.0,<0.12.0",
    "aiosqlite>=0.20.0,<0.21.0",
]

[project.entry-points.openbb_provider_extension]
econdb = "openbb_econdb:econdb_provider"

[tool.uv.sources]
openbb-core = { path = "../../core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["openbb_econdb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
