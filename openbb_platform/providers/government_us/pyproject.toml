[project]
name = "openbb-government-us"
version = "1.4.1"
description = "US Government Data Extension for OpenBB"
authors = [
    {name = "OpenBB", email = "hello@openbb.co"},
]
license = {text = "AGPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.9.21,<3.13"
dependencies = [
    "openbb-core",
    "random-user-agent>=1.0.1,<2.0.0",
]

[project.entry-points.openbb_provider_extension]
government_us = "openbb_government_us:government_us_provider"

[tool.uv.sources]
openbb-core = { path = "../../core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["openbb_government_us"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
