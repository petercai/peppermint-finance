[project]
name = "openbb-oecd"
version = "1.4.1"
description = "OECD extension for OpenBB"
authors = [
    {name = "OpenBB Team", email = "hello@openbb.co"},
]
license = {text = "AGPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.9.21,<3.13"
dependencies = [
    "openbb-core",
    "urllib3>1.26.16",
    "defusedxml>=0.8.0rc2,<0.9.0",
]

[project.entry-points.openbb_provider_extension]
oecd = "openbb_oecd:oecd_provider"

[tool.uv.sources]
openbb-core = { path = "../../core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["openbb_oecd"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
