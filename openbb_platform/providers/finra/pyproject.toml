[project]
name = "openbb-finra"
version = "1.4.1"
description = "FINRA extension for OpenBB"
authors = [
    {name = "OpenBB Team", email = "hello@openbb.co"},
]
license = {text = "AGPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.9.21,<3.13"
dependencies = [
    "openbb-core",
]

[project.entry-points.openbb_provider_extension]
finra = "openbb_finra:finra_provider"

[tool.uv.sources]
openbb-core = { path = "../../core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["openbb_finra"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
