[project]
name = "openbb-finviz"
version = "1.3.1"
description = "Finviz extension for OpenBB"
authors = [
    {name = "OpenBB Team", email = "hello@openbb.co"},
]
license = {text = "AGPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.9.21,<3.13"
dependencies = [
    "openbb-core",
    "finvizfinance>=1.1.0,<2.0.0",
]

[project.entry-points.openbb_provider_extension]
finviz = "openbb_finviz:finviz_provider"

[tool.uv.sources]
openbb-core = { path = "../../core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["openbb_finviz"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
