[project]
name = "openbb-deribit"
version = "1.0.1"
description = "Deribit is a crypto-native derivatives exchange."
authors = [
    {name = "OpenBB Team", email = "hello@openbb.co"},
]
license = {text = "AGPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.9.21,<3.13"
dependencies = [
    "openbb-core",
    "async-lru>=2.0.4,<3.0.0",
]

[project.entry-points.openbb_provider_extension]
deribit = "openbb_deribit:deribit_provider"

[tool.uv.sources]
openbb-core = { path = "../../core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["openbb_deribit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
