[project]
name = "openbb-stockgrid"
version = "1.4.1"
description = "stockgrid extension for OpenBB"
authors = [
    {name = "OpenBB Team", email = "hello@openbb.co"},
]
license = {text = "AGPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.9.21,<3.13"
dependencies = [
    "openbb-core",
    "pytest-freezegun>=0.4.2,<0.5.0",
]

[project.entry-points.openbb_provider_extension]
stockgrid = "openbb_stockgrid:stockgrid_provider"

[tool.uv.sources]
openbb-core = { path = "../../core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["openbb_stockgrid"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
