[project]
name = "openbb-intrinio"
version = "1.4.1"
description = "Intrinio extension for OpenBB"
authors = [
    {name = "OpenBB Team", email = "hello@openbb.co"},
]
license = {text = "AGPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.9.21,<3.13"
dependencies = [
    "requests-cache>=1.1.0,<2.0.0",
    "openbb-core",
]

[project.entry-points.openbb_provider_extension]
intrinio = "openbb_intrinio:intrinio_provider"

[tool.uv.sources]
openbb-core = { path = "../../core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["openbb_intrinio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
