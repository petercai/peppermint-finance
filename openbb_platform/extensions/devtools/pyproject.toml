[project]
name = "openbb-devtools"
version = "1.4.3"
description = "Tools for OpenBB Platform Developers"
authors = [
    {name = "OpenBB Team", email = "hello@openbb.co"},
]
license = {text = "AGPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.9.21,<3.13"
dependencies = [
    "ruff>=0.7,<0.8",
    "pylint>=3.3,<4.0",
    "mypy>=1.12.1,<2.0.0",
    "pydocstyle>=6.3.0,<7.0.0",
    "black>=25.1.0,<26.0.0",
    "bandit>=1.7.5,<2.0.0",
    "codespell>=2.2.5,<3.0.0",
    "pre-commit>=3.5.0,<4.0.0",
    "tox>=4.11.3,<5.0.0",
    "pytest>=7.4.3,<8.0.0",
    "pytest-subtests>=0.11.0,<0.12.0",
    "pytest-recorder>=0.4.6,<0.5.0",
    "pytest-asyncio>=0.23.2,<0.24.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "ipykernel>=6.29.5,<7.0.0",
    "types-python-dateutil>=2.8.19.14,<3.0.0.0",
    "types-toml>=0.10.8.7,<0.11.0.0",
    "poetry>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openbb_devtools"]
