[project]
name = "openbb-technical"
version = "1.4.3"
description = "Technical Analysis extension for OpenBB"
authors = [
    {name = "OpenBB Team", email = "hello@openbb.co"},
]
license = {text = "AGPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.9.21,<3.13"
dependencies = [
    "openbb-core",
    "pandas-ta-openbb>=0.4.20,<0.5.0",
    "scikit-learn>=1.6.0,<2.0.0",
]

[project.entry-points.openbb_core_extension]
technical = "openbb_technical.technical_router:router"

[project.entry-points.openbb_charting_extension]
technical = "openbb_technical.technical_views:TechnicalViews"

[tool.uv.sources]
openbb-core = { path = "../../core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["openbb_technical"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
