[project]
name = "openbb-derivatives"
version = "1.4.1"
description = "Derivatives extension for OpenBB"
authors = [
    {name = "OpenBB Team", email = "hello@openbb.co"},
]
license = {text = "AGPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.9.21,<3.13"
dependencies = [
    "openbb-core",
]

[project.entry-points.openbb_core_extension]
derivatives = "openbb_derivatives.derivatives_router:router"

[project.entry-points.openbb_charting_extension]
derivatives = "openbb_derivatives.derivatives_views:DerivativesViews"

[tool.uv.sources]
openbb-core = { path = "../../core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["openbb_derivatives"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
