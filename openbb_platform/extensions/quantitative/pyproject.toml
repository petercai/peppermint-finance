[project]
name = "openbb-quantitative"
version = "1.4.3"
description = "Quantitative Analysis extension for OpenBB"
authors = [
    {name = "OpenBB Team", email = "hello@openbb.co"},
]
license = {text = "AGPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.9.21,<3.13"
dependencies = [
    "openbb-core",
    "pandas-ta-openbb>=0.4.20,<0.5.0",
]

[project.entry-points.openbb_core_extension]
quantitative = "openbb_quantitative.quantitative_router:router"

[tool.uv.sources]
openbb-core = { path = "../../core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["openbb_quantitative"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
