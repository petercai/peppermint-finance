[project]
name = "openbb-econometrics"
version = "1.5.3"
description = "Econometrics Toolkit for OpenBB"
authors = [
    {name = "OpenBB Team", email = "hello@openbb.co"},
]
license = {text = "AGPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.9.21,<3.13"
dependencies = [
    "openbb-core",
    "pandas-ta-openbb>=0.4.20,<0.5.0",
    "arch>=7.2,<8.0",
    "linearmodels>=6,<7",
]

[project.entry-points.openbb_core_extension]
econometrics = "openbb_econometrics.econometrics_router:router"

[project.entry-points.openbb_charting_extension]
econometrics = "openbb_econometrics.econometrics_views:EconometricsViews"
[tool.uv.sources]
openbb-core = { path = "../../core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["openbb_econometrics"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
