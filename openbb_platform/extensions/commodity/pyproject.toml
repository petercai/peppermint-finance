[project]
name = "openbb-commodity"
version = "1.3.1"
description = "Commodity extension for OpenBB"
authors = [
    {name = "OpenBB Team", email = "hello@openbb.co"},
]
license = {text = "AGPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.9.21,<3.13"
dependencies = [
    "openbb-core",
]

[project.entry-points.openbb_core_extension]
commodity = "openbb_commodity.commodity_router:router"

[tool.uv.sources]
openbb-core = { path = "../../core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["openbb_commodity"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
